[build]
  command = "npm run build"
  publish = "dist"

# SPA fallback: serve index.html for any route so client-side rendering works.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# NOTE: Supabase keys are intentionally NOT committed here (.env is gitignored).
# Set them in Netlify -> Site settings -> Environment variables:
#   VITE_SUPABASE_URL
#   VITE_SUPABASE_ANON_KEY
# Vite inlines VITE_* vars at BUILD time, so you must redeploy after adding them.
